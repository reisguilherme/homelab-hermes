apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  namespace: spoke-hermes
spec:
  ingressClassName: traefik
  rules:
    - host: hermes.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-agent
                port:
                  number: 9119
