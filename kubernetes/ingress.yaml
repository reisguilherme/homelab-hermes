apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hub-only
  namespace: spoke-hermes
spec:
  ipAllowList:
    sourceRange:
      - 172.28.64.100/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  namespace: spoke-hermes
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: spoke-hermes-hub-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: hermes.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-agent
                port:
                  number: 9119
