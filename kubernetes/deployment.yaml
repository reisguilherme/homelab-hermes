apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: spoke-hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
    spec:
      restartPolicy: Always
      initContainers:
        - name: prepare-hermes-state
          image: &hermesImage nousresearch/hermes-agent:v0.23.3@sha256:3e9fe4c6ef36490f43aa0d0d80f9df64e9c92a576eee3042f1a97c8813c05355
          command:
            - sh
            - -ec
            - |
              rm -rf /opt/data/skills/media-diagnosis \
                     /opt/data/skills/media-operations \
                     /opt/data/skills/media-qbit-inventory \
                     /opt/data/.skills_prompt_snapshot.json
              if [ -f /opt/data/.env ] && [ ! -L /opt/data/.env ]; then
                sed -i '/^API_SERVER_KEY=/d; /^API_SERVER_HOST=/d; /^API_SERVER_PORT=/d' /opt/data/.env
              fi
              /opt/hermes/.venv/bin/python - <<'PY'
              from pathlib import Path
              import hermes_yaml as yaml
              from utils.files import atomic_yaml_write

              target = Path("/opt/data/config.yaml")
              if target.is_symlink():
                  raise SystemExit(f"Refusing to overwrite symlink: {target}")
              profile = yaml.safe_load(Path("/run/hermes-profile/config.yaml").read_text())
              previous = (yaml.safe_load(target.read_text()) or {}) if target.exists() else {}
              home = previous.get("platforms", {}).get("whatsapp", {}).get("home_channel")
              if home:
                  profile.setdefault("platforms", {}).setdefault("whatsapp", {}).setdefault("home_channel", home)
              atomic_yaml_write(target, profile)
              PY
              chown hermes:hermes /opt/data/config.yaml
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: state
              mountPath: /opt/data
            - name: profile
              mountPath: /run/hermes-profile/config.yaml
              subPath: config.yaml
              readOnly: true
      containers:
        - name: hermes
          image: *hermesImage
          args: ["sleep", "infinity"]
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data
            - name: HERMES_TUI_TOOLSETS
              value: media,observability,memory,session_search,skills,todo,clarify,delegation,vision
            - name: HERMES_DASHBOARD
              value: "true"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: ROOT_USERNAME
                  optional: true
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: ROOT_PASSWORD
                  optional: true
            - name: WHATSAPP_ENABLED
              value: "true"
            - name: WHATSAPP_MODE
              value: "bot"
            - name: HERMES_GATEWAY_BOOTSTRAP_STATE
              value: "running"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
          envFrom:
            - secretRef:
                name: hermes-secrets
                optional: true
            - secretRef:
                name: hermes-whatsapp
                optional: true
            - secretRef:
                name: hermes-api
          ports:
            - name: web
              containerPort: 9119
            - name: api
              containerPort: 8642
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1536Mi
          livenessProbe:
            tcpSocket:
              port: 9119
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9119
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: state
              mountPath: /opt/data
            - name: profile
              mountPath: /opt/data/profile.yaml
              subPath: profile.yaml
              readOnly: true
            - name: profile
              mountPath: /opt/data/SOUL.md
              subPath: SOUL.md
              readOnly: true
            - name: profile
              mountPath: /opt/data/AGENTS.md
              subPath: AGENTS.md
              readOnly: true
            - name: profile
              mountPath: /opt/data/skills/media-management/SKILL.md
              subPath: media-management.md
              readOnly: true
            - name: profile
              mountPath: /opt/data/skills/homelab-observability/SKILL.md
              subPath: homelab-observability.md
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: hermes-data
        - name: profile
          configMap:
            name: hermes-profile
