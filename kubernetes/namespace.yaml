apiVersion: v1
kind: Namespace
metadata:
  name: spoke-hermes
  labels:
    app.kubernetes.io/part-of: spoke-hermes
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: spoke-hermes-quota
  namespace: spoke-hermes
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 2Gi
    persistentvolumeclaims: "2"
