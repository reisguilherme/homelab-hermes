# Copiar para secrets/hermes-secrets.sops.yaml e criptografar com `sops -e -i`
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: spoke-hermes
type: Opaque
stringData:
  ROOT_USERNAME: root
  ROOT_PASSWORD: REPLACE_WITH_UNIFIED_ROOT_PASSWORD
  OPENAI_API_KEY: REPLACE_WITH_OPENAI_API_KEY
  # Mesmo token plano definido em homelab-mediaserver/secrets/mediaserver-secrets.sops.yaml:
  ARR_MCP_HERMES_TOKEN: amcp_REPLACE_WITH_64_HEX_TOKEN
